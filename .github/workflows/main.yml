name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A5C17E: ${{ secrets.A5C17E }}
          BF418F: ${{ secrets.BF418F }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A5C17E', '')
          tag_b = os.environ.get('BF418F', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- 15cf565de8d2dcbcb259e17a69940ddb2d66e973128f -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- ee3dd48245fcded5e59b97a3139ae51d7ff5dd8cc7 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
